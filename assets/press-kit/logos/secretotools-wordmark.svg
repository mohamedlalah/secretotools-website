<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#20a4ff"/><stop offset="1" stop-color="#006cff"/></linearGradient></defs>
<rect x="34" y="34" width="92" height="92" rx="24" fill="url(#g)"/><text x="80" y="94" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800" text-anchor="middle">ST</text>
<text x="154" y="101" fill="#f3f8ff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">SecretoTools</text>
